name: devlog_flutter_ui
description: A modern Flutter UI for DevLog (developer productivity tracker).
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_svg: ^2.0.9

 
  http: ^1.2.0
  intl: ^0.19.0


  fl_chart: ^0.69.0


  shared_preferences: ^2.3.3
  provider: ^6.1.2

  # 🧠 Optional backend-like helpers
  lib: ^0.2.1
  appwrite: ^20.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

google_fonts: ^6.3.2


  
  

  # 🅰️ Font: Urbanist (modern UI font)
  